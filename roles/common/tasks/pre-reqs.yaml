- name: Add Application User
  ansible.builtin.user:
    name: appuser
    system: true
    shell: /bin/false
    create_home: false

- name: Remove Directory
  ansible.builtin.file:
    path: /app
    state: absent

- name: Create Directory
  ansible.builtin.file:
    path: /app
    state: directory
    owner: appuser
    group: appuser
    mode: 'o-wxr'

- name: Unzip the {{component_name}}.zip file
  ansible.builtin.unarchive:
    src: 'https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/{{component_name}}.zip'
    dest: /app
    remote_src: yes
